[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polysolv"
version = "0.1.0"
description = "Physics-informed two-tower GNN for green-solvent selection in PS/PET dissolution recycling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2024.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "torch>=2.4",            # CUDA build: pip install torch --index-url https://download.pytorch.org/whl/cu130
    "torch_geometric>=2.6",
]

[project.optional-dependencies]
# xgboost added later at T16.
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

# src layout: the package is `src/polysolv` -> imports look like `from polysolv.data.clean import ...`
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore:`torch.jit.script` is deprecated:FutureWarning"]
