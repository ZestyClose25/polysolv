# Polysolv — all tunable values and paths. Paths are relative to the repo root.
seed: 42

paths:
  zhou_xlsx: data/raw/zhou2023/d3gc00404j1_suppl.xlsx
  polymer_props: data/external/polymer_props.csv
  green_solvents: data/external/green_solvents.csv
  exp_test: data/external/exp_test.csv
  processed_dir: data/processed

zhou:
  sheet_main: All solubility predictions
  sheet_info: Solvent Info
  rt_K: 298.15            # paper does not state RT exactly (assumption)
  polymer_rename:         # spreadsheet name -> short name used everywhere
    Nylon 6: PA6
    Nylon 66: PA66

clean:
  log_floor_wt: 1.0e-3    # target = log10(wt% + floor)
  miscible_cap_wt: 50.0   # 'M' -> censored label: true value >= cap (max numeric in Zhou ~52 wt%)
  dedupe: first           # one row per canonical SMILES; keep the first solvent in file order

descriptors:
  # Liquid molar volume V_s = a * McGowan_Vx + b, fitted on these known values (cm3/mol, 25 °C, Hansen handbook).
  molar_volume_anchors:
    O: 18.0            # water
    CO: 40.7           # methanol
    CCO: 58.5          # ethanol
    CC(C)=O: 74.0      # acetone
    CCOC(C)=O: 98.5    # ethyl acetate
    Cc1ccccc1: 106.8   # toluene
    CCCCCC: 131.6      # n-hexane
    C1CCCCC1: 108.7    # cyclohexane
    ClC(Cl)Cl: 80.7    # chloroform
    CS(C)=O: 71.3      # DMSO
    CN(C)C=O: 77.0     # DMF
    C1CCOC1: 81.7      # THF
    c1ccccc1: 89.4     # benzene
    CCCCCCC: 147.4     # n-heptane
    CCCCO: 91.5        # 1-butanol
    CC#N: 52.6         # acetonitrile
    ClCCl: 63.9        # dichloromethane
  solvent_features: [dD, dP, dH, bp_C, V_cm3_mol]
  solvent_flags: [has_hsp, has_bp]
  polymer_features: [Tg_K, Tm_K, crystallinity_pct, density_g_cm3]
  polymer_flags: [has_Tm]

physics:
  A0: 0.34               # entropic part of chi (Hansen/Flory-Huggins convention)

selectivity:              # ground truth for "PS-selective" (same thresholds as screening)
  target: PS
  other: PET
  ps_min: 10.0            # wt% PS at Th
  pet_max: 0.5            # wt% PET at Th
  min_T_C: 25.0           # Th below ambient is not a process condition

xgb:                      # T16 baseline (Morgan FP + descriptors + T -> log10 wt%)
  fp_radius: 2
  fp_bits: 2048
  trimer_n: 3             # polymer repeat unit joined n times, ends capped with H
  params:
    n_estimators: 3000
    learning_rate: 0.03
    max_depth: 8
    min_child_weight: 2
    subsample: 0.8
    colsample_bytree: 0.3
    reg_lambda: 1.0
    tree_method: hist
    device: cpu
  early_stopping_rounds: 200

split:
  fractions: [0.8, 0.1, 0.1]   # train / val / test
  seed: 42
  # Ring solvents grouped by Bemis–Murcko scaffold; acyclic solvents are their own group.
  big_group_frac: 0.5          # groups larger than this fraction of the test size always go to train

model:                    # T18-T20 physics-informed two-tower GIN
  hidden: 128             # GIN width and size of h_p, h_s
  gin_layers: 4
  dropout: 0.1
  interaction_hidden: [256, 128]
  ra2_scale: 100.0        # Ra2 (MPa) / scale -> interaction input
  dB_scale: 300.0         # K; dB = dB_scale * network output (last layer starts at 0 -> model starts at the Hansen prior)
  physics: true           # false = plain two-tower GIN baseline (MLP -> log10 wt% directly, 1000/T as input)

loss:                     # T21
  w_mse: 1.0              # censored MSE on log10 wt%
  w_rank: 0.0             # stage 2 (T25) sets this > 0: pairwise PS-over-PET selectivity rank loss
  w_phys: 1.0e-3          # L2 on dA and dB/dB_scale (stay close to the Hansen prior)
  rank_solvents: 64       # train solvents per rank mini-batch (both PS and PET at Th)

train:                    # T22
  epochs: 200
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-5
  patience: 30            # early stopping on val loss
  lr_factor: 0.5          # ReduceLROnPlateau
  lr_patience: 10
  grad_clip: 5.0
  device: cuda            # falls back to cpu if CUDA is not available
  checkpoint_dir: checkpoints
  log_dir: results/training_logs
